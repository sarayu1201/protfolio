@media (max-width:640px){nav{padding:18px 5vw;gap:10px}nav b{font-size:22px}nav div{gap:16px;font-size:15px;overflow-x:auto}}
body::after{display:none}
.spot,body::before,body::after{display:none}
#net{-webkit-mask-image:linear-gradient(90deg,#000 0,transparent 13%,transparent 87%,#000 100%);mask-image:linear-gradient(90deg,#000 0,transparent 13%,transparent 87%,#000 100%)}
.orb{opacity:.1}
.lg{flex:none;width:42px;height:42px;border-radius:12px;display:inline-grid;place-items:center;font-weight:700;font-family:'Space Grotesk','Inter',sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25);line-height:1}
.tag{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px}
.tag .lg{width:36px;height:36px;border-radius:10px}
.cert .tick{margin-left:auto}
@media (max-width:860px){#net{opacity:.55;-webkit-mask-image:linear-gradient(90deg,#000 0,transparent 7%,transparent 93%,#000 100%);mask-image:linear-gradient(90deg,#000 0,transparent 7%,transparent 93%,#000 100%)}}
.viz{height:74px;display:flex;align-items:center;gap:8px;margin-bottom:18px}
.v1{flex-direction:column;align-items:flex-start;justify-content:center;gap:8px}
.v1 i{display:block;height:9px;border-radius:5px;background:var(--ac);transform-origin:left;animation:tp 3.4s ease-in-out infinite}
.v1 i:nth-child(1){width:72%}.v1 i:nth-child(2){width:46%;background:var(--ac2);animation-delay:.3s}.v1 i:nth-child(3){width:60%;animation-delay:.6s}
@keyframes tp{0%{transform:scaleX(0)}35%,80%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.v2{position:relative}
.v2 i{position:absolute;left:0;width:96px;height:40px;border-radius:10px;border:1.5px solid var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--bg));animation:ly 3.6s ease-in-out infinite}
.v2 i:nth-child(1){top:6px}.v2 i:nth-child(2){top:17px;animation-delay:.25s}.v2 i:nth-child(3){top:28px;animation-delay:.5s}
@keyframes ly{50%{transform:translate(18px,-6px)}}
.v3{position:relative;width:170px}
.v3 i{flex:1;height:54px;border-radius:9px;border:1.5px solid var(--bd);background:var(--bg2)}
.v3 b{position:absolute;top:12px;left:6px;width:30px;height:16px;border-radius:5px;background:var(--ac);animation:kb 4s ease-in-out infinite}
@keyframes kb{0%,12%{transform:translateX(0)}42%,58%{transform:translateX(56px)}88%,100%{transform:translateX(112px)}}
.ping{position:relative;width:72px;height:72px;margin-bottom:24px}
.ping span{position:relative;z-index:1;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:var(--card);border:1px solid var(--bd)}
.ping i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ac);animation:pg 2.4s ease-out infinite}
.ping i:nth-child(2){animation-delay:1.2s}
@keyframes pg{from{transform:scale(1);opacity:.7}to{transform:scale(2.3);opacity:0}}
.cgrid{display:grid;gap:40px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.cl h3{font-size:28px;margin:0 0 8px}.cl p{color:var(--mt);margin:0 0 22px}
.cpy{border:0;cursor:pointer;font:inherit;font-weight:600;margin-bottom:22px}
.ct a{transition:transform .25s,color .25s}.ct a:hover{transform:translateX(8px)}
.cf{display:flex;flex-direction:column;gap:14px}
.cf input,.cf textarea{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;outline:0;resize:vertical;transition:border-color .25s,box-shadow .25s}
.cf input:focus,.cf textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
.cf .btn{text-align:center}
.row2{display:flex;gap:12px;flex-wrap:wrap}
.row2 .btn{font:inherit;font-weight:600;cursor:pointer;text-align:center}
.btn.o{background:none;color:var(--tx)}
.btn.o:hover{border-color:var(--ac);color:var(--ac)}
.snd{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px}
.snd .pl2{display:inline-block;transition:transform .7s cubic-bezier(.5,0,.2,1),opacity .7s}
.snd:hover .pl2{transform:translate(4px,-3px) rotate(8deg)}
.snd.go .pl2{transform:translate(90px,-50px) rotate(22deg) scale(.5);opacity:0}
.snd .ok{animation:pop .5s both}
.note{font-size:14px;color:var(--ac);font-weight:600;animation:pop .5s both}
.hint{color:var(--mt);font-size:13px}
</style>

function Cursor(){
  const d=useRef(),rg=useRef();
  useEffect(()=>{
    if(!matchMedia("(pointer:fine)").matches)return;
    let tx=0,ty=0,x=0,y=0,id;
    const mm=e=>{tx=e.clientX;ty=e.clientY;d.current.style.transform=`translate(${tx}px,${ty}px)`;rg.current.classList.toggle("big",!!e.target.closest("a,button"))};
    addEventListener("mousemove",mm);
    const lp=()=>{x+=(tx-x)*.15;y+=(ty-y)*.15;rg.current.style.transform=`translate(${x}px,${y}px)`;id=requestAnimationFrame(lp)};lp();
    return()=>{removeEventListener("mousemove",mm);cancelAnimationFrame(id)};
  },[]);
  return h("div",null,h("i",{className:"cd",ref:d}),h("i",{className:"cr",ref:rg}));
}
